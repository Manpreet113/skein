[package]
name        = "skein"
version     = "0.1.0"
edition     = "2021"
description = "Wallpaper-driven color scheme generator and theme daemon (matugen/pywal-style)"
license     = "MIT OR Apache-2.0"

[lib]
name = "skein"
path = "src/lib.rs"

[[bin]]
name = "skeind"
path = "src/main.rs"

[[bin]]
name = "skeinc"
path = "src/bin/skeinc/main.rs"

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
[dependencies]

# ── Async runtime ────────────────────────────────────────────────────────────
tokio        = { version = "1",   features = ["full"] }
tokio-util   = { version = "0.7", features = ["codec"] }
bytes        = "1"

# ── Filesystem watcher (wallpaper monitoring) ────────────────────────────────
notify       = "6"

# ── Color science ────────────────────────────────────────────────────────────
palette      = { version = "0.7", features = ["std"] }
kmeans_colors = { version = "0.7", features = ["palette_color"] }

# ── Image loading & downsampling ─────────────────────────────────────────────
image        = { version = "0.25", default-features = true }

# ── Serialization ────────────────────────────────────────────────────────────
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"

# ── CLI ──────────────────────────────────────────────────────────────────────
clap = { version = "4", features = ["derive"] }

# ── Templating (legacy file-write fallback) ──────────────────────────────────
minijinja    = { version = "2", features = ["loader", "json"] }

# ── Observability ────────────────────────────────────────────────────────────
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }

# ── Error handling ───────────────────────────────────────────────────────────
anyhow       = "1"
thiserror    = "1"

# ── Misc utilities ───────────────────────────────────────────────────────────
futures-util = "0.3"
dirs-next    = "2"

# ── TUI (skeinc) ─────────────────────────────────────────────────────────────
ratatui    = { version = "0.30", features = ["crossterm"] }
crossterm  = { version = "0.29", features = ["event-stream"] }

# ---------------------------------------------------------------------------
# Dev-only dependencies
# ---------------------------------------------------------------------------
[dev-dependencies]
tempfile     = "3"
proptest = "1.0"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
